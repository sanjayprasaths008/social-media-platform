{% extends 'base.html' %}
{% block title %}Edit Profile — LOOP{% endblock %}
{% block content %}

<div class="form-card">
  <h2>Edit profile</h2>
  <p class="sub">Just the bio for now — keep it short.</p>
  <form method="POST">
    <div class="field">
      <label>Bio</label>
      <textarea name="bio" rows="3" maxlength="200">{{ current_user.bio }}</textarea>
    </div>
    <button type="submit" class="btn btn-violet btn-block">Save changes</button>
  </form>
  <p class="form-foot"><a href="{{ url_for('profile', username=current_user.username) }}">&larr; Back to profile</a></p>
</div>

{% endblock %}
