{% extends 'base.html' %}
{% block title %}Sign Up — LOOP{% endblock %}
{% block content %}

<div class="form-card">
  <h2>Join LOOP</h2>
  <p class="sub">Takes less than a minute.</p>
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" required autofocus pattern="[A-Za-z0-9]+" title="Letters and numbers only">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" required minlength="4">
    </div>
    <button type="submit" class="btn btn-violet btn-block">Sign up</button>
  </form>
  <p class="form-foot">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>

{% endblock %}
